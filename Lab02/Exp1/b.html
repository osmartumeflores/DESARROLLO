<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>css en cabecera</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f4f4f9;
    }
    header {
      background-color: #2c3e50;
      color: #ffffff;
      text-align: center;
      padding: 20px;
    }
    header h1 {
      margin: 0;
      font-size: 28px;
    }
    header p {
      margin: 5px 0 0 0;
      font-size: 14px;
    }
    main {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background-color: #ffffff;
      border-radius: 8px;
    }
    section {
      margin-bottom: 20px;
    }
    h2 {
      color: #2c3e50;
      border-bottom: 2px solid #2c3e50;
      padding-bottom: 5px;
    }
    p {
      color: #333333;
      line-height: 1.6;
    }
    footer {
      background-color: #2c3e50;
      color: #ffffff;
      text-align: center;
      padding: 10px;
      margin-top: 20px;
    }
    footer p {
      margin: 0;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Introducción al Desarrollo Web</h1>
    <p>Laboratorio de Aplicaciones</p>
  </header>

  <main>
    <section>
      <h2>Sección Principal</h2>
      <p>Prueba de estilos en línea.</p>
    </section>

    <section>
      <h2>Sección Secundaria</h2>
      <p>Mas pruebas</p>
    </section>
  </main>

  <footer>
    <p>© 2026 - Guía de Práctica CSS</p>
  </footer>

</body>
</html>
