<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Horario de Clases</title>
    <style>
        table { border-collapse: collapse; font-family: sans-serif; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
    </style>
</head>
<body>

    <h1>School timetable</h1>

    <table>
        <!-- Definición de estilos agrupados para columnas -->
        <colgroup>
            <!-- Col 1 y 2 sin estilo -->
            <col>
            <col>
            <!-- Col 3: Martes -->
            <col style="background-color: #97DB9A;">
            <!-- Col 4: Miércoles -->
            <col style="width: 42px;">
            <!-- Col 5: Jueves -->
            <col style="background-color: #97DB9A;">
            <!-- Col 6: Viernes (Día especial) -->
            <col style="background-color: #DCC48E; border: 4px solid #C1437A;">
            <!-- Col 7 y 8: Sábado y Domingo -->
            <col style="width: 42px;" span="2">
        </colgroup>

        <thead>
            <tr>
                <th></th>
                <th>Mon</th>
                <th>Tues</th>
                <th>Wed</th>
                <th>Thurs</th>
                <th>Fri</th>
                <th>Sat</th>
                <th>Sun</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>1st period</td>
                <td>English</td>
                <td></td>
                <td></td>
                <td>German</td>
                <td>Dutch</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>2nd period</td>
                <td>English</td>
                <td>English</td>
                <td></td>
                <td>German</td>
                <td>Dutch</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>3rd period</td>
                <td></td>
                <td>German</td>
                <td></td>
                <td>German</td>
                <td>Dutch</td>
                <td></td>
                <td></td>
            </tr>
            <tr>
                <td>4th period</td>
                <td></td>
                <td>English</td>
                <td></td>
                <td>English</td>
                <td>Dutch</td>
                <td></td>
                <td></td>
            </tr>
        </tbody>
    </table>

</body>
</html>
