<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla de Animales</title>
    <style>
        table { border-collapse: collapse; width: 80%; margin: 20px auto; }
        th, td { border: 1px solid #999; padding: 8px; text-align: center; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <table>
        <tr>
            <th colspan="2">Animales</th>
            <th>Categoría</th>
        </tr>
        <tr>
            <td rowspan="2">Caballo</td>
            <td>Mamífero</td>
            <td>Terrestre</td>
        </tr>
        <tr>
            <td>Herbívoro</td>
            <td>Doméstico</td>
        </tr>
        <tr>
            <td rowspan="2">Pollo</td>
            <td>Ave</td>
            <td>Ovíparo</td>
        </tr>
        <tr>
            <td>Granja</td>
            <td>Doméstico</td>
        </tr>
        <tr>
            <td colspan="2">Hipopótamo</td>
            <td>Salvaje</td>
        </tr>
        <tr>
            <td colspan="2">Cocodrilo</td>
            <td>Reptil</td>
        </tr>
    </table>

</body>
</html>
