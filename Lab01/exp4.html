<!DOCTYPE html>
<html lang="es">
<head>
    <!-- b) Codificación de caracteres -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&lt;title&gt; element</title>

    <!-- c) Descripción para motores de búsqueda (SEO) -->
    <meta name="description" content="The Mozilla Developer Network (MDN) proporciona información sobre tecnologías de código abierto que incluyen HTML, CSS y APIs.">

    <!-- d) Protocolo Open Graph para redes sociales -->
    <meta property="og:title" content="Mozilla Developer Network - MDN" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://developer.mozilla.org/mdn-social-share.png" />
    <meta property="og:url" content="https://developer.mozilla.org" />

    <!-- e) Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@mozdevnet" />
    <meta name="twitter:title" content="Mozilla Developer Network" />
    <meta name="twitter:description" content="Recursos para desarrolladores de la Web Abierta." />
    <meta name="twitter:image" content="https://developer.mozilla.org/mdn-social-share.png" />
</head>
<body>

    <h1>&lt;h1&gt; element</h1>
    <p>Ejemplo en japonés para probar caracteres: ご飯が熱い。</p>

</body>
</html>
