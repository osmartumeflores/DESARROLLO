<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tabla con Encabezados</title>
    <style>
        table { border-collapse: collapse; margin: 20px; }
        td, th { border: 1px solid #333; padding: 10px; }
    </style>
</head>
<body>

    <table>
        <tr>
            <th>Encabezado 1</th>
            <th>Encabezado 2</th>
            <th>Encabezado 3</th>
            <th>Encabezado 4</th>
        </tr>
        <tr>
            <td>Hola, soy tu primera celda.</td>
            <td>Soy tu segunda celda.</td>
            <td>Soy tu tercera celda.</td>
            <td>Soy tu cuarta celda.</td>
        </tr>
        <tr>
            <td>Segunda fila, primera celda.</td>
            <td>Celda 2.</td>
            <td>Celda 3.</td>
            <td>Celda 4.</td>
        </tr>
    </table>

</body>
</html>
